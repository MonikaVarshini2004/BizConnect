# ===============================
# Server Configuration (Dynamic Port for Render)
# ===============================
server.port=${PORT:8080}

# Load local overrides from .env if present (ignored in git)
spring.config.import=optional:file:.env[.properties],optional:file:../.env[.properties]

# ===============================
# MySQL Database Configuration (Aiven / Local)
# ===============================
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===============================
# JPA / Hibernate Configuration
# ===============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=true

# ===============================
# JWT Authentication Configuration
# ===============================
bizconnect.jwt.secret=${JWT_SECRET:}
bizconnect.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# ===============================
# CORS Configuration
# ===============================
bizconnect.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:}

# ===============================
# Logging Configuration
# ===============================
logging.level.com.bizconnect=DEBUG
logging.level.org.springframework.security=INFO

